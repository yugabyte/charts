# yaml-language-server: $schema=https://raw.githubusercontent.com/quintush/helm-unittest/master/schema/helm-testsuite.json
suite: yugabyted-ui credentials
tests:
- it: passes the credentials to yugabyted-ui through its environment, each as one quoted argument
  template: templates/service.yaml
  set:
    oldNamingStyle: true
    authCredentials:
      ysql:
        user: app user
        password: pw;echo INJECTED
      ycql:
        user: cql user
        password: cq'l pw
  documentSelector:
    path: metadata.name
    value: yb-tserver
  asserts:
  - contains:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].env
      content:
        name: YSQL_USER
        value: app user
  - contains:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].env
      content:
        name: YSQL_PASSWORD
        value: pw;echo INJECTED
  - contains:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].env
      content:
        name: YCQL_USER
        value: cql user
  - contains:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].env
      content:
        name: YCQL_PASSWORD
        value: cq'l pw
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].args[2]
      pattern: '-ysql_username="\$YSQL_USER" \\\n +-ycql_username="\$YCQL_USER" \\\n +-ysql_password="\$YSQL_PASSWORD" \\\n +-ycql_password="\$YCQL_PASSWORD" \\'
  - notMatchRegex:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].args[2]
      pattern: 'INJECTED|app user|cql user'

- it: takes the passwords from passwordSecretName, as the setup-credentials job does
  template: templates/service.yaml
  set:
    oldNamingStyle: true
    authCredentials:
      ysql:
        passwordSecretName: ysql-secret
      ycql:
        passwordSecretName: ycql-secret
  documentSelector:
    path: metadata.name
    value: yb-master
  asserts:
  - contains:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].env
      content:
        name: YSQL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: ysql-secret
            key: ysqlPassword
  - contains:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].env
      content:
        name: YCQL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: ycql-secret
            key: ycqlPassword
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].args[2]
      pattern: '-ysql_password="\$YSQL_PASSWORD" \\\n +-ycql_password="\$YCQL_PASSWORD" \\'

- it: passes no credentials when none are configured
  template: templates/service.yaml
  set:
    oldNamingStyle: true
  documentSelector:
    path: metadata.name
    value: yb-tserver
  asserts:
  - notMatchRegex:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].args[2]
      pattern: '-y[sc]ql_(username|password)='
  - notContains:
      path: spec.template.spec.containers[?(@.name == "yugabyted-ui")].env
      any: true
      content:
        name: YSQL_PASSWORD
