# yaml-language-server: $schema=https://raw.githubusercontent.com/quintush/helm-unittest/master/schema/helm-testsuite.json
suite: setup-credentials
templates:
- hooks/setup-credentials-job.yaml
tests:
- it: YSQL password
  set:
    authCredentials:
      ysql:
        password: ysql_password
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0].name
      value: YSQL_PASSWORD
  - equal:
      path: spec.template.spec.containers[0].env[0].value
      value: ysql_password
- it: YSQL password secret
  set:
    authCredentials:
      ysql:
        passwordSecretName: ysql_password_secret
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0].name
      value: YSQL_PASSWORD
  - equal:
      path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
      value: ysql_password_secret
- it: YCQL password
  set:
    authCredentials:
      ycql:
        password: ycql_password
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0].name
      value: YCQL_PASSWORD
  - equal:
      path: spec.template.spec.containers[0].env[0].value
      value: ycql_password
- it: YCQL password secret
  set:
    authCredentials:
      ycql:
        passwordSecretName: ycql_password_secret
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0].name
      value: YCQL_PASSWORD
  - equal:
      path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
      value: ycql_password_secret
- it: credentials holding quotes and backslashes reach the job as they are
  set:
    authCredentials:
      ysql:
        user: app "user"
        password: it's a "pass\word"
        database: app\db
      ycql:
        user: cql "user"
        password: it's a "pass\word"
        keyspace: cql_ks
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: YSQL_USER
        value: app "user"
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: YSQL_PASSWORD
        value: it's a "pass\word"
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: YSQL_DB
        value: app\db
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: YCQL_USER
        value: cql "user"
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: YCQL_PASSWORD
        value: it's a "pass\word"