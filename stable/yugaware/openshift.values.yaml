# OCP compatible values for yugaware

image:

  repository: quay.io/yugabyte/yugaware-ubi

  postgres:
    # For non default postgres image, set postgres.sampleConfig values accordingly
    # in values.yaml.
    registry: registry.redhat.io
    tag: 1-1791892090
    name: rhel9/postgresql-18
    # Red Hat tags are build numbers, not Postgres versions.
    majorVersion: "18"
    # Postgres postgresql.conf.sample location on container. This will be used to mount
    # configmap with custom settings.
    sampleConfLocation: /usr/share/pgsql/postgresql.conf.sample
    # The Red Hat image ignores PGDATA and keeps its data here.
    dataDir: /var/lib/pgsql/data/userdata

  prometheus:
    registry: registry.redhat.io
    tag: v4.11.0
    name: openshift4/ose-prometheus

rbac:
  create: false

ocpCompatibility:
  enabled: true

securityContext:
  enabled: false

containerSecurityContext:
  enabled: false

## Perf Advisor is not shipped on OpenShift: its image is not UBI based, so it does not
## belong in the RH certified bundle, and the sub-chart has no securityContext plumbing for
## the restricted SCC.
perf-advisor-chart:
  yugaware:
    enabled: false
