suite: Bundled Postgres major-version migration
templates:
- statefulset.yaml
- configs.yaml
tests:
- it: runs pg-major-upgrade after postgres-init, on the whole volume, with the chart's sample config
  template: statefulset.yaml
  asserts:
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].image
      value: quay.io/yugabyte/yba-postgres-upgrade:pg-18-b1
  - contains:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /var/lib/postgresql
  - contains:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].volumeMounts
      content:
        name: pg-sample-config
        mountPath: /usr/pgsql-18/share/postgresql.conf.sample
        subPath: postgresql.conf.sample
  - exists:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].env[?(@.name == "UPGRADE_REVISION")].value
  # Only pg-upkeep follows it.
  - equal:
      path: spec.template.spec.initContainers[-2].name
      value: pg-major-upgrade
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].env[?(@.name == "PG_TARGET_MAJOR")].value
      value: "18"

- it: serves postgres 18 from postgres_data_18
  template: statefulset.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[?(@.name == "postgres")].image
      value: quay.io/yugabyte/hardened-postgres:18.7
  - contains:
      path: spec.template.spec.containers[?(@.name == "postgres")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /var/lib/postgresql/data
        subPath: postgres_data_18
  # Upkeep used to be a postStart hook, which runs alongside a server clients can
  # already reach. It is the pg-upkeep init container now.
  - notExists:
      path: spec.template.spec.containers[?(@.name == "postgres")].lifecycle

- it: runs pg-upkeep last, on the serving image, with the postgres container's view of the volume
  template: statefulset.yaml
  asserts:
  - equal:
      path: spec.template.spec.initContainers[-1].name
      value: pg-upkeep
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")].image
      value: quay.io/yugabyte/hardened-postgres:18.7
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")].command
      value: ["/bin/bash", "/pg_upkeep/pg-upkeep.sh"]
  - contains:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /var/lib/postgresql/data
        subPath: postgres_data_18
  - contains:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")].volumeMounts
      content:
        name: pg-upkeep
        mountPath: /pg_upkeep
  # postgres.user is the superuser initdb created; it need not be named postgres.
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")].env[?(@.name == "POSTGRES_USER")].valueFrom.secretKeyRef.key
      value: postgres_user
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")].resources.requests.memory
      value: 500Mi

- it: postgres-init mounts the whole volume and creates the new data dir
  template: statefulset.yaml
  asserts:
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "postgres-init")].env[?(@.name == "PGDATA")].value
      value: /pg_volume/postgres_data_18/pgdata
  - contains:
      path: spec.template.spec.initContainers[?(@.name == "postgres-init")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /pg_volume
  # It takes the UID from the shell (see the pg-prerun test), not from the chart's values.
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "postgres-init")].env[?(@.name == "PG_UID")]
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "postgres-init")].env[?(@.name == "PG_GID")]

- it: postgres-init fixes ownership of every cluster on the volume, without naming versions
  template: configs.yaml
  documentSelector:
    path: metadata.name
    value: RELEASE-NAME-yugaware-pg-prerun
  asserts:
  - matchRegex:
      path: data["pg-prerun.sh"]
      pattern: for d in /pg_volume/postgres_data_\*/pgdata
  - notMatchRegex:
      path: data["pg-prerun.sh"]
      pattern: userdata
  - notMatchRegex:
      path: data["pg-prerun.sh"]
      pattern: chown

- it: derives every version-specific path from image.postgres.tag
  template: statefulset.yaml
  set:
    image.postgres.tag: "19.1"
    perf-advisor-chart.image.postgres.tag: "19.1"
  asserts:
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].env[?(@.name == "PG_TARGET_MAJOR")].value
      value: "19"
  - contains:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].volumeMounts
      content:
        name: pg-sample-config
        mountPath: /usr/pgsql-19/share/postgresql.conf.sample
        subPath: postgresql.conf.sample
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "postgres-init")].env[?(@.name == "PGDATA")].value
      value: /pg_volume/postgres_data_19/pgdata
  - contains:
      path: spec.template.spec.containers[?(@.name == "postgres")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /var/lib/postgresql/data
        subPath: postgres_data_19

- it: uses majorVersion when the tag carries no version, e.g. a retagged mirror
  template: statefulset.yaml
  set:
    image.postgres.tag: prod
    image.postgres.majorVersion: 18
    perf-advisor-chart.image.postgres.tag: prod
  asserts:
  - contains:
      path: spec.template.spec.containers[?(@.name == "postgres")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /var/lib/postgresql/data
        subPath: postgres_data_18

- it: fails early when neither the tag nor majorVersion gives a major version
  template: statefulset.yaml
  set:
    image.postgres.tag: prod
    perf-advisor-chart.image.postgres.tag: prod
  asserts:
  - failedTemplate:
      errorMessage: "Cannot tell the Postgres major version: image.postgres.tag \"prod\" is not a version (e.g. a build number or a retagged mirror). Set image.postgres.majorVersion, e.g. 18."

- it: fails when majorVersion disagrees with the tag
  template: statefulset.yaml
  set:
    image.postgres.majorVersion: 19
  asserts:
  - failedTemplate:
      errorMessage: 'image.postgres.tag "18.7" is Postgres 18 but image.postgres.majorVersion is 19. Set them to the same major version, or leave majorVersion empty.'

- it: fails when majorVersion is not a number
  template: statefulset.yaml
  set:
    image.postgres.majorVersion: latest
  asserts:
  - failedTemplate:
      errorMessage: 'image.postgres.majorVersion must be a Postgres major version such as 18 (got "latest")'

- it: takes the major version from any tag that reads as a version
  template: statefulset.yaml
  set:
    image.postgres.tag: 18-alpine
    perf-advisor-chart.image.postgres.tag: 18-alpine
  asserts:
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].env[?(@.name == "PG_TARGET_MAJOR")].value
      value: "18"

- it: serves pgdata/ through PGDATA alone with the default dataDir
  template: statefulset.yaml
  set:
    image.postgres.dataDir: /var/lib/postgresql/data/pgdata/
  asserts:
  - equal:
      path: spec.template.spec.containers[?(@.name == "postgres")].env[?(@.name == "PGDATA")].value
      value: /var/lib/postgresql/data/pgdata
  - notExists:
      path: spec.template.spec.containers[?(@.name == "postgres")].volumeMounts[?(@.subPath == "postgres_data_18/pgdata")]

- it: serves pgdata/ at a custom dataDir, for an image with a fixed data path
  template: statefulset.yaml
  set:
    image.postgres.dataDir: /data/pg
  asserts:
  - equal:
      path: spec.template.spec.containers[?(@.name == "postgres")].env[?(@.name == "PGDATA")].value
      value: /data/pg
  - contains:
      path: spec.template.spec.containers[?(@.name == "postgres")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /data/pg
        subPath: postgres_data_18/pgdata
  - contains:
      path: spec.template.spec.containers[?(@.name == "postgres")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /var/lib/postgresql/data
        subPath: postgres_data_18
  - notExists:
      path: spec.template.spec.containers[?(@.name == "postgres")].env[?(@.name == "POSTGRESQL_USER")]

- it: rejects a dataDir inside the migration state mount
  template: statefulset.yaml
  set:
    image.postgres.dataDir: /var/lib/postgresql/data
  asserts:
  - failedTemplate:
      errorMessage: 'image.postgres.dataDir "/var/lib/postgresql/data" is inside /var/lib/postgresql/data, where the chart keeps the migration state; use /var/lib/postgresql/data/pgdata or a path outside it'

- it: rejects a relative dataDir
  template: statefulset.yaml
  set:
    image.postgres.dataDir: pgdata
  asserts:
  - failedTemplate:
      errorMessage: 'image.postgres.dataDir must be an absolute path (got "pgdata")'

- it: with securityContext disabled, runs only the containers that write to the volume as root
  template: statefulset.yaml
  set:
    securityContext.enabled: false
    perf-advisor-chart.securityContext.enabled: false
    tls.enabled: true
    sidecars:
    - name: user-sidecar
      image: busybox
  asserts:
  - notExists:
      path: spec.template.spec.securityContext
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "postgres-init")]
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "prometheus-configuration")].securityContext
      value: {runAsUser: 0}
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].securityContext
      value: {runAsUser: 0}
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")].securityContext
      value: {runAsUser: 0}
  - equal:
      path: spec.template.spec.containers[?(@.name == "postgres")].securityContext
      value: {runAsUser: 0}
  - equal:
      path: spec.template.spec.containers[?(@.name == "prometheus")].securityContext
      value: {runAsUser: 0}
  - equal:
      path: spec.template.spec.containers[?(@.name == "yugaware")].securityContext
      value: {runAsUser: 0}
  - exists:
      path: spec.template.spec.initContainers[?(@.name == "build-keystore")]
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "build-keystore")].securityContext
  - exists:
      path: spec.template.spec.containers[?(@.name == "user-sidecar")]
  - notExists:
      path: spec.template.spec.containers[?(@.name == "user-sidecar")].securityContext

- it: on OpenShift with securityContext disabled, leaves the UID to the SCC
  template: statefulset.yaml
  set:
    securityContext.enabled: false
    perf-advisor-chart.securityContext.enabled: false
    ocpCompatibility.enabled: true
  asserts:
  - notExists:
      path: spec.template.spec.securityContext
  - notExists:
      path: spec.template.spec.containers[?(@.securityContext)]
  - notExists:
      path: spec.template.spec.initContainers[?(@.securityContext)]

- it: with securityContext disabled and containerSecurityContext enabled, the root containers take containerSecurityContext's user
  template: statefulset.yaml
  set:
    securityContext.enabled: false
    perf-advisor-chart.securityContext.enabled: false
    containerSecurityContext.enabled: true
    containerSecurityContext.runAsUser: 2000
    containerSecurityContext.runAsGroup: 3000
    perf-advisor-chart.containerSecurityContext.enabled: true
  asserts:
  - notExists:
      path: spec.template.spec.securityContext
  - notExists:
      path: spec.template.spec.containers[?(@.securityContext.runAsUser == 0)]
  - notExists:
      path: spec.template.spec.initContainers[?(@.securityContext.runAsUser == 0)]
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "prometheus-configuration")].securityContext
      value: {runAsUser: 2000, runAsGroup: 3000, runAsNonRoot: true}
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].securityContext
      value: {runAsUser: 2000, runAsGroup: 3000, runAsNonRoot: true}
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")].securityContext
      value: {runAsUser: 2000, runAsGroup: 3000, runAsNonRoot: true}
  - equal:
      path: spec.template.spec.containers[?(@.name == "postgres")].securityContext
      value: {runAsUser: 2000, runAsGroup: 3000, runAsNonRoot: true}
  - equal:
      path: spec.template.spec.containers[?(@.name == "prometheus")].securityContext
      value: {runAsUser: 2000, runAsGroup: 3000, runAsNonRoot: true}
  - equal:
      path: spec.template.spec.containers[?(@.name == "yugaware")].securityContext
      value: {runAsUser: 2000, runAsGroup: 3000, runAsNonRoot: true}

- it: with both securityContext and containerSecurityContext enabled, the containers take containerSecurityContext's user
  template: statefulset.yaml
  set:
    containerSecurityContext.enabled: true
    containerSecurityContext.runAsUser: 2000
    containerSecurityContext.runAsGroup: 3000
    perf-advisor-chart.containerSecurityContext.enabled: true
  asserts:
  - equal:
      path: spec.template.spec.securityContext.runAsUser
      value: 10001
  - notExists:
      path: spec.template.spec.containers[?(@.securityContext.runAsUser == 0)]
  - notExists:
      path: spec.template.spec.initContainers[?(@.securityContext.runAsUser == 0)]
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].securityContext.runAsUser
      value: 2000
  - equal:
      path: spec.template.spec.containers[?(@.name == "postgres")].securityContext.runAsUser
      value: 2000
  - equal:
      path: spec.template.spec.containers[?(@.name == "yugaware")].securityContext.runAsUser
      value: 2000

- it: with securityContext disabled, renders no ownership-fix script
  template: configs.yaml
  set:
    securityContext.enabled: false
    perf-advisor-chart.securityContext.enabled: false
  asserts:
  - notMatchRegex:
      path: metadata.name
      pattern: pg-prerun$

- it: with securityContext enabled, leaves the UID to the pod securityContext
  template: statefulset.yaml
  asserts:
  - equal:
      path: spec.template.spec.securityContext.runAsUser
      value: 10001
  - notExists:
      path: spec.template.spec.containers[?(@.securityContext)]
  - notExists:
      path: spec.template.spec.initContainers[?(@.securityContext)]

- it: migrates the Red Hat image on OpenShift and serves postgres_data_18/pgdata from userdata/
  template: statefulset.yaml
  values:
  - ../openshift.values.yaml
  asserts:
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "postgres-init")].image
      value: registry.redhat.io/rhel9/postgresql-18:1-1791892090
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "postgres-init")].env[?(@.name == "PGDATA")].value
      value: /pg_volume/postgres_data_18/pgdata
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "postgres-init")].env[?(@.name == "PG_UID")]
  - notExists:
      path: spec.template.spec.containers[?(@.name == "postgres")].securityContext
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")].env[?(@.name == "PG_TARGET_MAJOR")].value
      value: "18"
  - equal:
      path: spec.template.spec.containers[?(@.name == "postgres")].image
      value: registry.redhat.io/rhel9/postgresql-18:1-1791892090
  - contains:
      path: spec.template.spec.containers[?(@.name == "postgres")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /var/lib/pgsql/data/userdata
        subPath: postgres_data_18/pgdata
  - contains:
      path: spec.template.spec.containers[?(@.name == "postgres")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /var/lib/postgresql/data
        subPath: postgres_data_18
  - contains:
      path: spec.template.spec.containers[?(@.name == "postgres")].volumeMounts
      content:
        name: pg-sample-config
        mountPath: /usr/share/pgsql/postgresql.conf.sample
        subPath: postgresql.conf.sample
  - notExists:
      path: spec.template.spec.containers[?(@.name == "postgres")].lifecycle
  # Upkeep runs on Red Hat's image too, and like postgres leaves the UID to the SCC.
  - equal:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")].image
      value: registry.redhat.io/rhel9/postgresql-18:1-1791892090
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")].securityContext
  - exists:
      path: spec.template.spec.containers[?(@.name == "postgres")].env[?(@.name == "POSTGRESQL_USER")]
  - equal:
      path: spec.template.spec.containers[?(@.name == "postgres")].env[?(@.name == "PGDATA")].value
      value: /var/lib/pgsql/data/userdata

- it: uses the Red Hat layout on OpenShift whatever the registry, e.g. a mirror
  template: statefulset.yaml
  values:
  - ../openshift.values.yaml
  set:
    image.postgres.registry: mirror.example.com/rh
  asserts:
  - contains:
      path: spec.template.spec.containers[?(@.name == "postgres")].volumeMounts
      content:
        name: yugaware-storage
        mountPath: /var/lib/pgsql/data/userdata
        subPath: postgres_data_18/pgdata
  - exists:
      path: spec.template.spec.containers[?(@.name == "postgres")].env[?(@.name == "POSTGRESQL_USER")]

- it: renders the ownership-fix script, which hands pgdata to the UID it runs as
  template: configs.yaml
  documentSelector:
    path: metadata.name
    value: RELEASE-NAME-yugaware-pg-prerun
  asserts:
  - matchRegex:
      path: data["pg-prerun.sh"]
      pattern: \n *PG_UID=\$\(id -u\)\n

- it: on OpenShift, renders the same ownership-fix script, which takes the UID the SCC assigned
  template: configs.yaml
  values:
  - ../openshift.values.yaml
  documentSelector:
    path: metadata.name
    value: RELEASE-NAME-yugaware-pg-prerun
  asserts:
  - matchRegex:
      path: data["pg-prerun.sh"]
      pattern: \n *PG_UID=\$\(id -u\)\n

- it: fails early for the Red Hat image without majorVersion, as its tags are build numbers
  template: statefulset.yaml
  values:
  - ../openshift.values.yaml
  set:
    image.postgres.majorVersion: ""
  asserts:
  - failedTemplate:
      errorMessage: "Cannot tell the Postgres major version: image.postgres.tag \"1-1791892090\" is not a version (e.g. a build number or a retagged mirror). Set image.postgres.majorVersion, e.g. 18."

- it: touches no postgres data with an external database
  template: statefulset.yaml
  set:
    postgres.external.host: db.example
    perf-advisor-chart.yugaware.enabled: false
  asserts:
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")]
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "postgres-init")]
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")]
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "pg-upkeep")]

- it: renders no upkeep script with an external database
  template: configs.yaml
  set:
    postgres.external.host: db.example
    perf-advisor-chart.yugaware.enabled: false
  asserts:
  - notExists:
      path: data["pg-upkeep.sh"]

- it: does not need a major version from the tag with an external database
  template: statefulset.yaml
  set:
    postgres.external.host: db.example
    image.postgres.tag: prod
    perf-advisor-chart.image.postgres.tag: prod
    perf-advisor-chart.yugaware.enabled: false
  asserts:
  - notFailedTemplate: {}

- it: does not migrate when YugabyteDB is the backend
  template: statefulset.yaml
  set:
    useYugabyteDB: true
    perf-advisor-chart.yugaware.enabled: false
  asserts:
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "pg-major-upgrade")]
  - notExists:
      path: spec.template.spec.initContainers[?(@.name == "pg-upkeep")]

- it: renders the upkeep script
  template: configs.yaml
  documentSelector:
    path: metadata.name
    value: RELEASE-NAME-yugaware-pg-upkeep
  asserts:
  - matchRegex:
      path: data["pg-upkeep.sh"]
      pattern: REFRESH COLLATION VERSION
  - matchRegex:
      path: data["pg-upkeep.sh"]
      pattern: --analyze-only --missing-stats-only
  - matchRegex:
      path: data["pg-upkeep.sh"]
      pattern: pg_database_collation_actual_version
  # Refreshing the collation version without rebuilding the indexes first would only
  # silence the mismatch warning.
  - matchRegex:
      path: data["pg-upkeep.sh"]
      pattern: '-c "REINDEX DATABASE \\"\$db\\"" -c "ALTER DATABASE \\"\$db\\" REFRESH COLLATION VERSION"'

# Clients that connect mid-upkeep can copy a stale template1 (Perf Advisor's db-init fails
# for good) or hold locks the rebuild needs, so the temporary server takes none.
- it: keeps every client out of the temporary server
  template: configs.yaml
  documentSelector:
    path: metadata.name
    value: RELEASE-NAME-yugaware-pg-upkeep
  asserts:
  - matchRegex:
      path: data["pg-upkeep.sh"]
      pattern: "listen_addresses='' -k /tmp"

- it: runs the temporary server the way the postgres container does
  template: configs.yaml
  documentSelector:
    path: metadata.name
    value: RELEASE-NAME-yugaware-pg-upkeep
  asserts:
  # postgres.sampleConfig's huge_pages=off (PLAT-8563); the default "try" can SIGBUS.
  - matchRegex:
      path: data["pg-upkeep.sh"]
      pattern: -c huge_pages=off
  # An fsGroup leaves the data directory group-writable, which postgres refuses; the
  # entrypoints fix that, but they run after this init container.
  - matchRegex:
      path: data["pg-upkeep.sh"]
      pattern: '(?s)chmod 700 "\$PGDATA".*pg_ctl .* start'
  # As root (securityContext.enabled=false) postgres must run as the data owner.
  - matchRegex:
      path: data["pg-upkeep.sh"]
      pattern: 'setpriv --reuid="\$\(stat -c %u "\$PGDATA"\)"'
  - matchRegex:
      path: data["pg-upkeep.sh"]
      pattern: '"\$\{as_owner\[@\]\}" pg_ctl .* stop'
  - matchRegex:
      path: data["pg-upkeep.sh"]
      pattern: 'vacuumdb -h /tmp -U "\$POSTGRES_USER"'
  - notMatchRegex:
      path: data["pg-upkeep.sh"]
      pattern: -U postgres
  # Once template1 is current, Perf Advisor and YBA create their own databases.
  - notMatchRegex:
      path: data["pg-upkeep.sh"]
      pattern: CREATE DATABASE
