# yaml-language-server: $schema=https://raw.githubusercontent.com/quintush/helm-unittest/master/schema/helm-testsuite.json
# Charts before 2.31 generated an 8-character bundled PostgreSQL password, which FIPS mode
# rejects (PBKDF2 needs 14 bytes). A FIPS upgrade replaces it: the pg-password-update hook sets
# the new one in the database, through a hook Secret, before the global-config Secret is applied.
suite: bundled PostgreSQL password rotation on a FIPS upgrade
templates:
- templates/global-config.yaml
- templates/pg_password_updator.yaml
- templates/fips-validation.yaml
release: {name: yw, namespace: yb, upgrade: true}
tests:
- it: replaces a short generated password on a FIPS upgrade
  template: templates/global-config.yaml
  kubernetesProvider: &shortPassword
    scheme: &scheme
      "v1/Secret": {gvr: {version: v1, resource: secrets}, namespaced: true}
      "apps/v1/StatefulSet": {gvr: {group: apps, version: v1, resource: statefulsets}, namespaced: true}
    objects:
    - apiVersion: v1
      kind: Secret
      metadata: {name: yw-yugaware-global-config, namespace: yb}
      data:
        postgres_db: eXVnYXdhcmU=
        postgres_user: cG9zdGdyZXM=
        # "aB3dE5gH": 8 bytes.
        postgres_password: YUIzZEU1Z0g=
  set: &fips
    yugaware.fips.enabled: true
    image.tag: 2.31.0.0-b1
  asserts:
  - notEqual:
      path: data.postgres_password
      value: YUIzZEU1Z0g=
  - matchRegex:
      # 16 alphanumeric characters.
      path: data.postgres_password
      pattern: '^[A-Za-z0-9+/]{22}==$'

- it: hands the new password to the hooks through a hook Secret
  template: templates/pg_password_updator.yaml
  kubernetesProvider: *shortPassword
  set: *fips
  asserts:
  - hasDocuments:
      count: 2
  - documentIndex: 0
    isKind:
      of: Secret
  - documentIndex: 0
    equal:
      path: metadata.name
      value: yw-yugaware-pg-password-rotation
  - documentIndex: 0
    equal:
      path: metadata.annotations["helm.sh/hook-weight"]
      value: "-11"
  - documentIndex: 0
    matchRegex:
      path: data.postgres_password
      pattern: '^[A-Za-z0-9+/]{22}==$'
  - documentIndex: 1
    contains:
      path: spec.template.spec.containers[0].env
      content:
        name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: yw-yugaware-pg-password-rotation
            key: postgres_password

- it: does not fail the FIPS password check when the password is replaced
  template: templates/fips-validation.yaml
  kubernetesProvider: *shortPassword
  set: *fips
  asserts:
  - notFailedTemplate: {}

- it: keeps a short password with FIPS mode off
  template: templates/global-config.yaml
  kubernetesProvider: *shortPassword
  set:
    image.tag: 2.31.0.0-b1
  asserts:
  - equal:
      path: data.postgres_password
      value: YUIzZEU1Z0g=

- it: keeps a long enough password on a FIPS upgrade
  template: templates/global-config.yaml
  kubernetesProvider:
    scheme: *scheme
    objects:
    - apiVersion: v1
      kind: Secret
      metadata: {name: yw-yugaware-global-config, namespace: yb}
      data:
        # "aB3dE5gH1jK2lM3n": 16 bytes.
        postgres_password: YUIzZEU1Z0gxaksybE0zbg==
  set: *fips
  asserts:
  - equal:
      path: data.postgres_password
      value: YUIzZEU1Z0gxaksybE0zbg==

- it: does not rotate or add a hook Secret when the password is kept
  template: templates/pg_password_updator.yaml
  kubernetesProvider: *shortPassword
  set:
    image.tag: 2.31.0.0-b1
  asserts:
  - hasDocuments:
      count: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: yw-yugaware-global-config
            key: postgres_password

- it: does not replace an external database password, and says how to change it
  template: templates/fips-validation.yaml
  set:
    yugaware.fips.enabled: true
    postgres.external.host: db.example.com
    postgres.external.user: yugaware
    postgres.external.pass: short
  asserts:
  - failedTemplate:
      errorPattern: 'Change the password of database user yugaware on db.example.com to one of at least 14 bytes, and set it with\npostgres.external.pass.'
