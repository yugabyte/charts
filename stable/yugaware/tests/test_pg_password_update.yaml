suite: Postgres password update hook
templates:
- pg_password_updator.yaml
tests:
- it: re-sets the password as scram-sha-256 with psql from the container PATH
  release:
    upgrade: true
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: psql
  - notContains:
      path: spec.template.spec.containers[0].args
      content: /usr/bin/psql
  - contains:
      path: spec.template.spec.containers[0].args
      content: "SET password_encryption = 'scram-sha-256'; ALTER USER $(POSTGRES_USER) WITH PASSWORD '$(POSTGRES_PASSWORD)';"

- it: is not rendered on install
  asserts:
  - hasDocuments:
      count: 0
