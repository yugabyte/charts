# yaml-language-server: $schema=https://raw.githubusercontent.com/quintush/helm-unittest/master/schema/helm-testsuite.json
suite: fips enable and disable
templates:
- templates/statefulset.yaml
- templates/configs.yaml
- templates/keystore.yaml
- templates/fips-validation.yaml
tests:
- it: FIPS enabled
  set:
    yugaware:
      fips:
        enabled: true
  asserts:
  - template: templates/statefulset.yaml
    contains:
      path: spec.template.spec.containers[?(@.name == "yugaware")].args
      content: "-Dorg.bouncycastle.fips.approved_only=true"

- it: FIPS disabled
  set:
    yugaware:
      fips:
        enabled: false
  asserts:
  - template: templates/statefulset.yaml
    contains:
      path: spec.template.spec.containers[?(@.name == "yugaware")].args
      content: "-Dorg.bouncycastle.fips.approved_only=true"
    not: true

# BouncyCastle dlopen()s the native libraries it unpacks, so they cannot go to a noexec /tmp.
# Needed in both modes: the keystore is BCFKS either way.
- it: the platform points BouncyCastle's native libraries at a writable volume, FIPS or not
  set:
    yugaware:
      fips:
        enabled: false
  asserts:
  - template: templates/statefulset.yaml
    contains:
      path: spec.template.spec.containers[?(@.name == "yugaware")].args
      content: "-Dorg.bouncycastle.native.loader.install_dir=/opt/yugabyte/yugaware/data/bcnative"

- it: so does the platform in FIPS mode
  set:
    yugaware:
      fips:
        enabled: true
  asserts:
  - template: templates/statefulset.yaml
    contains:
      path: spec.template.spec.containers[?(@.name == "yugaware")].args
      content: "-Dorg.bouncycastle.native.loader.install_dir=/opt/yugabyte/yugaware/data/bcnative"

- it: and so does the keytool run that builds the keystore
  set:
    tls:
      enabled: true
  asserts:
  - template: templates/keystore.yaml
    matchRegex:
      path: data["build-keystore.sh"]
      pattern: '-J-Dorg\.bouncycastle\.native\.loader\.install_dir="\$\{BC_NATIVE_DIR\}"'

# The keystore is BCFKS whenever TLS is on, FIPS or not: ssl-config parses PEM itself and
# re-wraps it outside the validated provider, which approved-only mode rejects, and using one
# format everywhere keeps the two modes on the same path.
- it: TLS serves from a BCFKS keystore built by an init container
  set:
    tls:
      enabled: true
  asserts:
  - template: templates/configs.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yugaware-app-config
    matchRegex:
      path: data["application.docker.conf"]
      pattern: 'type = BCFKS'
  - template: templates/configs.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yugaware-app-config
    matchRegex:
      path: data["application.docker.conf"]
      pattern: 'path = /opt/keystore/server\.bcfks'
  - template: templates/configs.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yugaware-app-config
    matchRegex:
      path: data["application.docker.conf"]
      pattern: 'type = PEM'
    not: true
  - template: templates/statefulset.yaml
    equal:
      path: spec.template.spec.initContainers[?(@.name == "build-keystore")].volumeMounts[1].mountPath
      value: /opt/keystore
  - template: templates/keystore.yaml
    hasDocuments:
      count: 1

- it: no TLS means no keystore to build
  set:
    tls:
      enabled: false
    yugaware:
      fips:
        enabled: true
  asserts:
  - template: templates/keystore.yaml
    hasDocuments:
      count: 0

# cert-manager supplies tls.crt/tls.key rather than a concatenated server.pem, and that branch
# is inside the init container script rather than the keystore type.
- it: cert-manager also serves from BCFKS
  set:
    tls:
      enabled: true
      certManager:
        enabled: true
  asserts:
  - template: templates/configs.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-yugaware-app-config
    matchRegex:
      path: data["application.docker.conf"]
      pattern: 'type = BCFKS'
  - template: templates/keystore.yaml
    matchRegex:
      path: data["build-keystore.sh"]
      pattern: 'CERT=/opt/certs/tls.crt'

# The database password has to clear the validated module's 112-bit minimum, because the
# PostgreSQL driver derives its SCRAM key through it. Only a password given in values can be
# checked here - the generated one lives in a Secret that helm unittest cannot look up.
- it: a short external database password is rejected in FIPS mode
  template: templates/fips-validation.yaml
  set:
    yugaware.fips.enabled: true
    postgres.external.host: db.example.com
    postgres.external.pass: short
  asserts:
  - failedTemplate:
      errorPattern: 'postgres\.external\.pass is 5 bytes, but FIPS mode needs at least 14'

- it: a long enough external database password is accepted in FIPS mode
  template: templates/fips-validation.yaml
  set:
    yugaware.fips.enabled: true
    postgres.external.host: db.example.com
    postgres.external.pass: a-long-enough-password
  asserts:
  - notFailedTemplate: {}

- it: the database password is not checked with FIPS mode off
  template: templates/fips-validation.yaml
  set:
    yugaware.fips.enabled: false
    postgres.external.host: db.example.com
    postgres.external.pass: short
  asserts:
  - notFailedTemplate: {}

# FIPS mode is fixed at install. The installed mode is read from the running StatefulSet's
# yugaware args, so these mock that lookup.
- it: turning FIPS on for a release installed without it is rejected
  template: templates/fips-validation.yaml
  release: &release {name: yw, namespace: yb}
  kubernetesProvider: &nonFipsRelease
    scheme: &stsScheme
      "apps/v1/StatefulSet":
        gvr: {group: apps, version: v1, resource: statefulsets}
        namespaced: true
    objects:
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: yw-yugaware, namespace: yb}
      spec:
        template:
          spec:
            containers:
            - name: yugaware
              args: ["bin/yugaware", "-Dconfig.file=/data/application.docker.conf"]
  set:
    yugaware.fips.enabled: true
  asserts:
  - failedTemplate:
      errorPattern: 'installed with FIPS mode off, (.|\n)*Set yugaware\.fips\.enabled=false'

- it: turning FIPS off for a release installed with it is rejected
  template: templates/fips-validation.yaml
  release: *release
  kubernetesProvider: &fipsRelease
    scheme: *stsScheme
    objects:
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: yw-yugaware, namespace: yb}
      spec:
        template:
          spec:
            containers:
            - name: yugaware
              args:
              - bin/yugaware
              - -Dorg.bouncycastle.fips.approved_only=true
              - -Dconfig.file=/data/application.docker.conf
  set:
    yugaware.fips.enabled: false
  asserts:
  - failedTemplate:
      errorPattern: 'installed with FIPS mode on, (.|\n)*Set yugaware\.fips\.enabled=true'

- it: an upgrade that keeps the installed FIPS mode is accepted
  template: templates/fips-validation.yaml
  release: *release
  kubernetesProvider: *fipsRelease
  set:
    yugaware.fips.enabled: true
    postgres.external.host: db.example.com
    postgres.external.pass: a-long-enough-password
  asserts:
  - notFailedTemplate: {}

- it: so does one that keeps it off
  template: templates/fips-validation.yaml
  release: *release
  kubernetesProvider: *nonFipsRelease
  set:
    yugaware.fips.enabled: false
  asserts:
  - notFailedTemplate: {}

- it: a fresh install can choose either mode
  template: templates/fips-validation.yaml
  release: *release
  set:
    yugaware.fips.enabled: true
    postgres.external.host: db.example.com
    postgres.external.pass: a-long-enough-password
  asserts:
  - notFailedTemplate: {}
