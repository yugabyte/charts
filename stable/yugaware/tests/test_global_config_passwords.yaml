# yaml-language-server: $schema=https://raw.githubusercontent.com/quintush/helm-unittest/master/schema/helm-testsuite.json
suite: generated passwords in the global-config Secret
templates:
- templates/global-config.yaml
release: &release {name: yw, namespace: yb}
tests:
- it: a fresh install with TLS generates a keystore password
  set:
    tls.enabled: true
  asserts:
  - matchRegex:
      path: data.keystore_password
      pattern: '^[A-Za-z0-9+/=]{20,}$'

# Passwords are looked up per key. A release installed without TLS has a global-config Secret
# with no keystore_password; turning TLS on by upgrade must generate one rather than copy the
# missing entry as an empty string, which made build-keystore fail with "Keystore password must
# be at least 6 characters" and left the pod crash-looping.
- it: turning TLS on by upgrade generates a keystore password and keeps the database password
  release: *release
  kubernetesProvider:
    scheme: &secretScheme
      "v1/Secret":
        gvr: {version: v1, resource: secrets}
        namespaced: true
    objects:
    - apiVersion: v1
      kind: Secret
      metadata: {name: yw-yugaware-global-config, namespace: yb}
      data:
        postgres_db: eXVnYXdhcmU=
        postgres_user: cG9zdGdyZXM=
        postgres_password: a2VlcC10aGlzLXBhc3N3b3Jk
  set:
    tls.enabled: true
  asserts:
  - matchRegex:
      path: data.keystore_password
      pattern: '^[A-Za-z0-9+/=]{20,}$'
  - equal:
      path: data.postgres_password
      value: a2VlcC10aGlzLXBhc3N3b3Jk

- it: an existing keystore password is kept on upgrade
  release: *release
  kubernetesProvider:
    scheme: *secretScheme
    objects:
    - apiVersion: v1
      kind: Secret
      metadata: {name: yw-yugaware-global-config, namespace: yb}
      data:
        postgres_password: a2VlcC10aGlzLXBhc3N3b3Jk
        keystore_password: a2VlcC10aGlzLWtleXN0b3Jl
  set:
    tls.enabled: true
  asserts:
  - equal:
      path: data.keystore_password
      value: a2VlcC10aGlzLWtleXN0b3Jl

- it: an empty keystore password written by an earlier chart is replaced
  release: *release
  kubernetesProvider:
    scheme: *secretScheme
    objects:
    - apiVersion: v1
      kind: Secret
      metadata: {name: yw-yugaware-global-config, namespace: yb}
      data:
        postgres_password: a2VlcC10aGlzLXBhc3N3b3Jk
        keystore_password: ""
  set:
    tls.enabled: true
  asserts:
  - matchRegex:
      path: data.keystore_password
      pattern: '^[A-Za-z0-9+/=]{20,}$'
