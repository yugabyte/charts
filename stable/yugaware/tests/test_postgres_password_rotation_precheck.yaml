# yaml-language-server: $schema=https://raw.githubusercontent.com/quintush/helm-unittest/master/schema/helm-testsuite.json
# The node agent precheck runs after the pg-password-update hook, so once that hook replaced the
# bundled PostgreSQL password it has to connect with the new one, not the global-config Secret's.
suite: node agent precheck uses a rotated PostgreSQL password
templates:
- templates/node_agent_installed_preupgrade_hook.yaml
release: {name: yw, namespace: yb, upgrade: true}
tests:
- it: connects with the new password on a FIPS upgrade that replaces it
  set:
    yugaware.fips.enabled: true
    image.tag: 2.31.0.0-b1
  kubernetesProvider: &shortPassword
    scheme:
      "v1/Secret": {gvr: {version: v1, resource: secrets}, namespaced: true}
      "v1/Service": {gvr: {version: v1, resource: services}, namespaced: true}
    objects:
    - {kind: Service, apiVersion: v1, metadata: {name: yw-postgres, namespace: yb}}
    - apiVersion: v1
      kind: Secret
      metadata: {name: yw-yugaware-global-config, namespace: yb}
      data:
        # "aB3dE5gH": 8 bytes.
        postgres_password: YUIzZEU1Z0g=
  documentIndex: 0
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: yw-yugaware-pg-password-rotation
            key: postgres_password

- it: connects with the global-config password otherwise
  set:
    image.tag: 2.31.0.0-b1
  kubernetesProvider: *shortPassword
  documentIndex: 0
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: yw-yugaware-global-config
            key: postgres_password
