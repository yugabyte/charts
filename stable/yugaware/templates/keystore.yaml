{{- if .Values.tls.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-yugaware-keystore
  labels:
    app: {{ template "yugaware.name" . }}
    chart: {{ template "yugaware.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Values.helm2Legacy | ternary "Tiller" (.Release.Service | quote) }}
{{- if .Values.commonLabels }}
{{ include "yugaware.commonLabels" . | indent 4 }}
{{- end }}
data:
  build-keystore.sh: |
    #!/bin/bash
    set -e -o pipefail

    # BCFKS regardless of whether FIPS mode is on, so there is one keystore format to reason
    # about rather than one per mode. "PEM" and "PEMCFG" are not JCE keystore types - ssl-config
    # parses those itself and re-wraps them outside the validated module, which approved-only mode
    # rejects - so FIPS mode needs BCFKS, and using it everywhere keeps the two paths identical.
    OUT_DIR=/opt/keystore
    KEYSTORE="${OUT_DIR}/server.bcfks"
    STAGED="${KEYSTORE}.new"
    BC_FIPS_PROVIDER=org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider

    # keytool comes from the JRE in this image, which is the one running the platform - the
    # keystore has to be built by the JVM and BouncyCastle provider that later read it, so it is
    # resolved from java rather than taken from whatever PATH offers.
    JAVA_BIN=$(command -v java || true)
    if [[ -z "${JAVA_BIN}" ]]; then
      echo "No java in this image, so the BCFKS keystore cannot be built."
      exit 1
    fi
    KEYTOOL="$(dirname "$(readlink -f "${JAVA_BIN}")")/keytool"
    if [[ ! -x "${KEYTOOL}" ]]; then
      echo "No keytool next to ${JAVA_BIN} (looked for ${KEYTOOL})."
      exit 1
    fi

    {{- if .Values.tls.certManager.enabled }}
    # cert-manager writes the pair as separate files.
    CERT=/opt/certs/tls.crt
    KEY=/opt/certs/tls.key
    {{- else }}
    # server.pem holds the key and the certificate concatenated; openssl reads both from it.
    CERT=/opt/certs/server.pem
    KEY=/opt/certs/server.pem
    {{- end }}

    # keytool has no BCFKS support unless it is handed the provider jar, which the image keeps in
    # the application's lib directory.
    BC_FIPS_JAR=$(ls /opt/yugabyte/yugaware/lib/*bc-fips-*.jar 2>/dev/null | head -1)
    if [[ -z "${BC_FIPS_JAR}" ]]; then
      echo "No bc-fips jar under /opt/yugabyte/yugaware/lib - cannot build a BCFKS keystore."
      exit 1
    fi

    # keytool dlopen()s the native libraries BouncyCastle unpacks, so they cannot go to a noexec
    # /tmp - the failure surfaces only as "Provider ... not found".
    BC_NATIVE_DIR=$(mktemp -d "${OUT_DIR}/.bcnative-XXXXXX")

    # keytool cannot import a PEM key pair, so the cert goes through a throwaway PKCS12.
    TMP_P12=$(mktemp /tmp/yugaware-keystore-XXXXXX)
    trap 'rm -rf "${TMP_P12}" "${STAGED}" "${BC_NATIVE_DIR}"' EXIT

    echo "Packaging the server certificate into a PKCS12 bundle"
    openssl pkcs12 -export -inkey "${KEY}" -in "${CERT}" \
      -out "${TMP_P12}" -name yugaware -passout env:KEYSTORE_PASSWORD

    echo "Converting the PKCS12 bundle to BCFKS"
    # keytool appends to an existing store, so it has to write somewhere empty - but not over the
    # keystore the volume already holds, which is what the platform serves from: a keytool failure
    # would otherwise leave the pod with nothing to present. Build it alongside and rename, which
    # is atomic within the directory and also drops the previous certificate's entry.
    rm -f "${STAGED}"
    "${KEYTOOL}" -importkeystore -noprompt \
      -J-Dorg.bouncycastle.native.loader.install_dir="${BC_NATIVE_DIR}" \
      -srckeystore "${TMP_P12}" -srcstoretype PKCS12 -srcstorepass:env KEYSTORE_PASSWORD \
      -destkeystore "${STAGED}" -deststoretype BCFKS \
      -deststorepass:env KEYSTORE_PASSWORD \
      -providerclass "${BC_FIPS_PROVIDER}" -providerpath "${BC_FIPS_JAR}"
    mv -f "${STAGED}" "${KEYSTORE}"
{{- end }}
