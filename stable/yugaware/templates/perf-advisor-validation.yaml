{{- /*
  Renders nothing. Helm resolves values before templates render, so the perf-advisor
  sub-chart cannot read this chart's database settings - they have to be repeated under
  perf-advisor-chart.postgres.external. This checks the two copies agree, so a database
  change made in one place but not the other fails at render time instead of leaving Perf
  Advisor pointed at the wrong server.

  Only host, port and user are compared. dbname is deliberately excluded: Perf Advisor keeps
  its own database ("ts") on the same server, separate from the one YugabyteDB Anywhere uses.
  The password is not compared either - it never needs repeating, because Perf Advisor reads
  postgres_password from the {{ .Release.Name }}-yugaware-global-config secret this chart
  already populates with whichever credentials are in use.
*/}}
{{- /*
  Walked with index/default rather than `dig`, which cannot descend into the
  chartutil.Values that sub-chart sections are typed as.
*/}}
{{- $paRoot := (index .Values "perf-advisor-chart") | default dict }}
{{- if (($paRoot.yugaware) | default dict).enabled }}
{{- $pa := (($paRoot.postgres) | default dict).external | default dict }}
{{- $paProm := (($paRoot.prometheus) | default dict).external | default dict }}
{{- $fix := "Set them to match, or disable Perf Advisor with perf-advisor-chart.yugaware.enabled=false." }}

{{- if .Values.postgres.external.host }}
  {{- /* External database: the sub-chart has to be given the same coordinates. */}}
  {{- if ne (toString ($pa.host | default "")) (toString .Values.postgres.external.host) }}
    {{- fail (printf "\n\nperf-advisor-chart.postgres.external.host is %q but postgres.external.host is %q.\nPerf Advisor must connect to the same database server as YugabyteDB Anywhere.\n%s\n" ($pa.host | default "") .Values.postgres.external.host $fix) }}
  {{- end }}
  {{- if ne (toString ($pa.port | default "")) (toString .Values.postgres.external.port) }}
    {{- fail (printf "\n\nperf-advisor-chart.postgres.external.port is %q but postgres.external.port is %q.\n%s\n" (toString ($pa.port | default "")) (toString .Values.postgres.external.port) $fix) }}
  {{- end }}
  {{- if ne (toString ($pa.user | default "")) (toString .Values.postgres.external.user) }}
    {{- fail (printf "\n\nperf-advisor-chart.postgres.external.user is %q but postgres.external.user is %q.\n%s\n" ($pa.user | default "") .Values.postgres.external.user $fix) }}
  {{- end }}

{{- else }}
  {{- /*
    In-pod database. The sub-chart reaches it through the {{ .Release.Name }}-postgres
    Service, so host/port stay empty on the sub-chart, but the username still has to match
    whichever database is running in the pod.
  */}}
  {{- if $pa.host }}
    {{- fail (printf "\n\nperf-advisor-chart.postgres.external.host is set to %q but postgres.external.host is empty, so YugabyteDB Anywhere is using the database in its own pod.\nLeave the sub-chart host empty to reach it through the %s-postgres Service.\n" $pa.host .Release.Name) }}
  {{- end }}
  {{- $dbUser := .Values.useYugabyteDB | ternary .Values.yugabytedb.user .Values.postgres.user }}
  {{- $dbValue := .Values.useYugabyteDB | ternary "yugabytedb.user" "postgres.user" }}
  {{- if ne (toString ($pa.user | default "")) (toString $dbUser) }}
    {{- fail (printf "\n\nperf-advisor-chart.postgres.external.user is %q but %s is %q.\nPerf Advisor connects to the same database as YugabyteDB Anywhere and must use the same account.\n%s\n" ($pa.user | default "") $dbValue $dbUser $fix) }}
  {{- end }}
  {{- if not .Values.postgres.service.enabled }}
    {{- fail (printf "\n\nPerf Advisor is enabled but postgres.service.enabled is false.\nIt reaches the database through the %s-postgres Service, which that value creates.\n%s\n" .Release.Name $fix) }}
  {{- end }}
{{- end }}

{{- if not .Values.prometheus.enabled }}
  {{- if not ($paProm.url | default "") }}
    {{- fail (printf "\n\nPerf Advisor is enabled but prometheus.enabled is false and perf-advisor-chart.prometheus.external.url is empty.\nSet that URL to an external Prometheus, or disable Perf Advisor with perf-advisor-chart.yugaware.enabled=false.\n") }}
  {{- end }}
{{- else if not .Values.yugaware.service.enabled }}
  {{- if not ($paProm.url | default "") }}
    {{- fail (printf "\n\nPerf Advisor is enabled but yugaware.service.enabled is false.\nIt queries Prometheus at http://%s-yugaware-ui:9090, which that value creates.\n%s\n" .Release.Name $fix) }}
  {{- end }}
{{- end }}
{{- if and (not .Values.yugaware.service.enabled) (.Values.perf-advisor-chart.yugaware.enabled) }}
  {{- fail (printf "\n\nPerf Advisor is enabled, requires yugaware.service.enabled to be true)" }}
{{- end }}
