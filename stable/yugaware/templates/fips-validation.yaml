{{- /*
  Renders nothing. In approved-only mode every PBKDF2 derivation has to meet the validated
  module's 112-bit minimum, including ones YugabyteDB Anywhere does not make itself: the
  PostgreSQL JDBC driver derives its SCRAM-SHA-256 salted password through SecretKeyFactory,
  which resolves to BCFIPS once FIPS mode puts it first. A database password shorter than 14
  bytes therefore fails authentication with

    FipsUnapprovedOperationError: password must be at least 112 bits

  during startup, before anything is logged about the database. Perf Advisor reads the same
  password out of this chart's <release>-yugaware-global-config Secret, so both components fail
  the same way, and neither says why.

  A fresh install generates 16 bytes and passes. What this catches is an install created before
  that, whose 8-byte generated password is kept across upgrades - turning FIPS mode on there
  breaks the deployment, and rotating a database password is not something a chart can do for
  the operator. `lookup` returns nothing under `helm template`, `--dry-run` and ArgoCD, so the
  generated case can only be checked against a live cluster; the render is allowed through when
  it cannot be read.
*/}}
{{- if .Values.yugaware.fips.enabled }}
{{- $minBytes := 14 }}
{{- $password := "" }}
{{- $field := "" }}
{{- $checked := true }}
{{- if .Values.postgres.external.host }}
  {{- $password = .Values.postgres.external.pass | default "" }}
  {{- $field = "postgres.external.pass" }}
{{- else }}
  {{- $secretName := printf "%s-yugaware-global-config" .Release.Name }}
  {{- $data := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict }}
  {{- if index $data "postgres_password" }}
    {{- $password = index $data "postgres_password" | b64dec }}
    {{- $field = printf "postgres_password in Secret %s" $secretName }}
  {{- else }}
    {{- $checked = false }}
  {{- end }}
{{- end }}
{{- if and $checked (lt (len $password) $minBytes) }}
  {{- fail (printf "\n\n%s is %d bytes, but FIPS mode needs at least %d.\nPostgreSQL SCRAM authentication derives its key with PBKDF2 through the FIPS module, which\nrejects anything shorter, so YugabyteDB Anywhere and Perf Advisor would both fail to reach\nthe database on startup.\nRotate the database password to a longer one, or disable FIPS mode with yugaware.fips.enabled=false.\n" $field (len $password) $minBytes) }}
{{- end }}
{{- end }}
