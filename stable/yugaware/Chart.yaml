apiVersion: v2
appVersion: 2026.1.1.0-b91
version: 2026.1.1
kubeVersion: ">=1.17.0-0"
home: https://www.yugabyte.com
description: YugabyteDB Anywhere provides deployment, orchestration, and monitoring for managing YugabyteDB clusters. YugabyteDB Anywhere can create a YugabyteDB cluster with multiple pods provided by Kubernetes or OpenShift and logically grouped together to form one logical distributed database.
name: yugaware
icon: https://avatars0.githubusercontent.com/u/17074854?s=200&v=4
maintainers:
- name: Sanketh Indarapu
  email: sanketh@yugabyte.com
- name: Govardhan Reddy Jalla
  email: gjalla@yugabyte.com
dependencies:
# Perf Advisor. Vendored as charts/perf-advisor-chart-0.3.0.tgz because it is not published
# to charts.yugabyte.com - see stable/yugaware/README.md for the refresh procedure.
# The condition doubles as the sub-chart's own "deployed under yugaware" switch: when it is
# false the chart is not rendered at all, which is what we want (rendering it with
# yugaware.enabled=false would deploy a second postgres and prometheus).
- name: perf-advisor-chart
  version: "1.3.0-b7"
  repository: "https://releases.yugabyte.com/perf-advisor"
  condition: perf-advisor-chart.yugaware.enabled
annotations:
  charts.openshift.io/name: yugaware
