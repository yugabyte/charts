---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: universekeyrotations.operator.yugabyte.io
spec:
  group: operator.yugabyte.io
  scope: Namespaced
  names:
    plural: universekeyrotations
    singular: universekeyrotation
    shortNames:
      - ukr
    kind: UniverseKeyRotation
    categories:
      - all
      - yugabyte
  versions:
    - name: v1alpha1
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Universe
          type: string
          description: The universe whose universe key is rotated
          jsonPath: .spec.universe
        - name: State
          type: string
          description: The state of the universe key rotation
          jsonPath: .status.state
        - name: Retries
          type: integer
          description: Number of times the rotation has been retried after a failure
          jsonPath: .status.retryCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >
            Custom resource definition for a YugabyteDB Anywhere universe (data) key rotation. Each
            resource represents a single imperative rotation, so listing the resources for a
            universe gives the rotation history.
          type: object
          properties:
            status:
              description: Universe key rotation status for the custom resource.
              type: object
              properties:
                state:
                  description: >
                    State of the rotation (e.g. Pending, Running, Retrying, Succeeded, Failed).
                  type: string
                message:
                  description: Message for the rotation (failure reason, progress, etc.).
                  type: string
                taskUUID:
                  description: Internal UUID of the task associated with the rotation.
                  type: string
                retryCount:
                  description: >
                    Number of times the rotation has been retried after a failure. The rotation is
                    marked Failed once this reaches the retry limit.
                  type: integer
                requestedAt:
                  description: Timestamp when the rotation was requested.
                  type: string
                completedAt:
                  description: Timestamp when the rotation completed.
                  type: string
            spec:
              type: object
              description: Universe key rotation specification.
              properties:
                universe:
                  description: >
                    Name of the universe whose universe key is to be rotated. Refers to a
                    ybuniverse CR name. Immutable.
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: "universe is immutable"
              required:
                - universe


