                        - rule: >-
                            (has(self.s3) && has(self.s3.paths) && has(self.s3.paths.helmChart) ? 1 : 0) +
                            (has(self.gcs) && has(self.gcs.paths) && has(self.gcs.paths.helmChart) ? 1 : 0) +
